name: commaviewd-canary-openpilot

# Early warning that upstream openpilot branches (ci/canary-openpilot.json) drifted away from
# commaviewd.
# The checks are commaviewd-verify.yml's: a target whose upstream commit already passed with the
# same commaviewd content (here, in CI, or in another canary) is skipped, so a quiet week costs
# only the plan.
on:
  schedule:
    - cron: '23 7 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  # Pass markers from pull requests count only after checking the pull request isn't a fork's.
  pull-requests: read

concurrency:
  group: commaviewd-canary-openpilot
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/commaviewd-verify.yml
    with:
      targets: ci/canary-openpilot.json
